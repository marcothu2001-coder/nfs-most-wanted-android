plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ea.nfsmw.nativeport'
    compileSdk 34

    defaultConfig {
        applicationId "com.ea.nfsmw.nativeport"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "2.0.0-full"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        aaptOptions {
            noCompress 'bin', 'BIN', 'tpk', 'TPK', 'img', 'bun'
        }

        androidResources {
            noCompress 'bin', 'BIN', 'tpk', 'TPK', 'img', 'bun'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android NativeAppGlue é embutido no NDK
}
